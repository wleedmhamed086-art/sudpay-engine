<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SudPay - لوحة التاجر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 font-sans p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        <div class="bg-slate-900 text-white p-6 rounded-2xl flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold">لوحة التاجر - متجر التقنية</h1>
                <p class="text-xs text-slate-400">إدارة الأرباح والطلبات المحجوزة</p>
            </div>
            <span class="bg-green-600 px-3 py-1 rounded-lg text-sm">حساب مفعل</span>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white p-5 rounded-xl border border-slate-200">
                <span class="text-slate-500 text-xs">الأرباح القابلة للسحب</span>
                <p class="text-2xl font-bold text-green-600 mt-1">450,000 <span class="text-xs">ج.س</span></p>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200">
                <span class="text-slate-500 text-xs">المبالغ المحجوزة (Escrow)</span>
                <p class="text-2xl font-bold text-amber-500 mt-1">150,000 <span class="text-xs">ج.س</span></p>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200">
                <span class="text-slate-500 text-xs">إجمالي الطلبات</span>
                <p class="text-2xl font-bold text-slate-800 mt-1">12 طلب</p>
            </div>
        </div>
    </div>
</body>
</html>
