<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>SudPay - لوحة التحكم للتاجر</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-6">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">لوحة التاجر - الأرباح والطلبات</h1>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-white p-4 rounded-xl shadow border-r-4 border-green-500">
                <p class="text-gray-500 text-sm">المبالغ المحجوزة (Escrow)</p>
                <p class="text-2xl font-bold text-gray-800">450,000 ج.س</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow border-r-4 border-blue-500">
                <p class="text-gray-500 text-sm">الأرباح المفرجة</p>
                <p class="text-2xl font-bold text-gray-800">1,200,000 ج.س</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow border-r-4 border-yellow-500">
                <p class="text-gray-500 text-sm">الطلبات قيد الشحن</p>
                <p class="text-2xl font-bold text-gray-800">12 طلب</p>
            </div>
        </div>
    </div>
</body>
</html>
