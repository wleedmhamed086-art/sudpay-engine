<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>SudPay - لوحة شركة الشحن</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-6">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow">
        <h2 class="text-xl font-bold text-blue-800 mb-4">تحديث أسعار الشحن التنافسية</h2>
        <form class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700">من ولاية:</label>
                    <input type="text" value="الخرطوم" class="w-full border rounded p-2 bg-gray-100" readonly>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700">إلى ولاية:</label>
                    <input type="text" value="بورتسودان" class="w-full border rounded p-2 bg-gray-100" readonly>
                </div>
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700">السعر التنافسي الجديد (ج.س):</label>
                <input type="number" placeholder="مثال: 3500" class="w-full border rounded p-2">
            </div>
            <button type="button" class="w-full bg-blue-600 text-white font-bold py-2 rounded-lg">حفظ وتحديث العروض فوراً</button>
        </form>
    </div>
</body>
</html>
