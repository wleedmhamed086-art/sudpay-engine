<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SudPay - المنصة الموحدة الشاملة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 font-sans min-h-screen flex flex-col">

    <!-- شريط التنقل الموحد -->
    <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-50 p-4">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3 space-x-reverse">
                <span class="bg-green-600 text-white px-4 py-1.5 rounded-xl text-xl font-black">SudPay</span>
                <span class="text-xs bg-slate-800 text-green-400 px-3 py-1 rounded-full border border-slate-700">النظام المتكامل 100%</span>
            </div>
            <!-- أزرار تبديل الأطراف -->
            <nav class="flex flex-wrap justify-center bg-slate-800 p-1.5 rounded-xl text-sm gap-1">
                <button onclick="switchView('customer')" id="btn-customer" class="role-btn px-4 py-2 rounded-lg bg-green-600 text-white font-bold transition">
                    <i class="fa-solid fa-bag-shopping ml-1"></i> تطبيق العميل
                </button>
                <button onclick="switchView('vendor')" id="btn-vendor" class="role-btn px-4 py-2 rounded-lg text-slate-300 hover:text-white transition">
                    <i class="fa-solid fa-store ml-1"></i> لوحة التاجر
                </button>
                <button onclick="switchView('carrier')" id="btn-carrier" class="role-btn px-4 py-2 rounded-lg text-slate-300 hover:text-white transition">
                    <i class="fa-solid fa-truck-fast ml-1"></i> شركات الشحن
                </button>
                <button onclick="switchView('admin')" id="btn-admin" class="role-btn px-4 py-2 rounded-lg text-slate-300 hover:text-white transition">
                    <i class="fa-solid fa-chart-line ml-1"></i> الإدارة العامة
                </button>
            </nav>
        </div>
    </header>

    <!-- مساحة العرض المتكاملة -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4">
        <section id="view-customer" class="view-section">
            <iframe src="/static/customer_app.html" class="w-full h-[750px] rounded-2xl border bg-white shadow-sm"></iframe>
        </section>
        <section id="view-vendor" class="view-section hidden">
            <iframe src="/static/vendor_dashboard.html" class="w-full h-[750px] rounded-2xl border bg-white shadow-sm"></iframe>
        </section>
        <section id="view-carrier" class="view-section hidden">
            <iframe src="/static/carrier_dashboard.html" class="w-full h-[750px] rounded-2xl border bg-white shadow-sm"></iframe>
        </section>
        <section id="view-admin" class="view-section hidden">
            <iframe src="/static/admin_dashboard.html" class="w-full h-[750px] rounded-2xl border bg-white shadow-sm"></iframe>
        </section>
    </main>

    <script>
        function switchView(role) {
            // إخفاء جميع الأقسام
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            // إزالة التنشيط عن الأزرار
            document.querySelectorAll('.role-btn').forEach(btn => {
                btn.classList.remove('bg-green-600', 'text-white', 'font-bold');
                btn.classList.add('text-slate-300');
            });
            // إظهار القسم المطلوب وتنشيط زرّه
            document.getElementById(`view-${role}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`btn-${role}`);
            activeBtn.classList.add('bg-green-600', 'text-white', 'font-bold');
            activeBtn.classList.remove('text-slate-300');
        }
    </script>
</body>
</html>
