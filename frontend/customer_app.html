<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SudPay - التسوق الآمن في السودان</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans p-4">
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg p-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-green-700">SudPay 💳</h1>
            <span class="bg-green-100 text-green-800 text-xs px-2.5 py-0.5 rounded-full font-bold">ضمان مالي 100%</span>
        </div>
        <div class="mb-4">
            <label class="block text-sm font-bold text-gray-700 mb-1">ولاية الاستلام:</label>
            <select id="destState" class="w-full border rounded-lg p-2 bg-gray-50" onchange="fetchOffers()">
                <option value="الخرطوم">الخرطوم</option>
                <option value="الجزيرة">الجزيرة</option>
                <option value="بورتسودان">بورتسودان (البحر الأحمر)</option>
                <option value="كسلا">كسلا</option>
            </select>
        </div>
        <h3 class="font-bold text-gray-800 mb-2 text-sm">أفضل عروض الشحن التنافسية:</h3>
        <div id="offersContainer" class="space-y-2 mb-6">
            <p class="text-xs text-gray-500">جاري تحميل العروض...</p>
        </div>
        <button onclick="checkoutWithEscrow()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl shadow-md transition duration-200">
            ادفع بأمان عبر بنكك (Escrow)
        </button>
    </div>
    <script>
        async function fetchOffers() {
            const dest = document.getElementById('destState').value;
            const res = await fetch(`/api/v1/shipping/offers?origin_state=الخرطوم&destination_state=${dest}`);
            const data = await res.json();
            const container = document.getElementById('offersContainer');
            container.innerHTML = '';
            data.forEach((offer, idx) => {
                container.innerHTML += `
                    <label class="flex items-center justify-between p-3 border rounded-xl cursor-pointer hover:border-green-500 ${idx===0?'border-green-500 bg-green-50':''}">
                        <div class="flex items-center space-x-3 space-x-reverse">
                            <input type="radio" name="carrier" value="${offer.carrier_id}" data-cost="${offer.cost_sdg}" ${idx===0?'checked':''}>
                            <div>
                                <p class="font-bold text-sm text-gray-800">${offer.carrier_name}</p>
                                <p class="text-xs text-gray-500">التسليم خلال ${offer.estimated_hours} ساعة</p>
                            </div>
                        </div>
                        <span class="font-bold text-sm text-green-700">${offer.cost_sdg} ج.س</span>
                    </label>
                `;
            });
        }
        async function checkoutWithEscrow() {
            const selectedCarrier = document.querySelector('input[name="carrier"]:checked');
            if(!selectedCarrier) return alert("الرجاء اختيار شركة شحن");
            const carrierId = selectedCarrier.value;
            const shippingCost = parseFloat(selectedCarrier.dataset.cost);
            const res = await fetch('/api/v1/checkout/escrow-initiate?customer_phone=0912345678&vendor_id=1&carrier_id=' + carrierId + '&products_amount_sdg=15000&shipping_cost_sdg=' + shippingCost, {
                method: 'POST'
            });
            const data = await res.json();
            if(data.success) {
                alert(`تم حجز المبلغ بأمان!\nكود الطلب: ${data.order_code}\nرمز الاستلام (OTP): ${data.delivery_otp}\nيرجى فتح بنكك لإكمال التحويل.`);
            }
        }
        fetchOffers();
    </script>
</body>
</html>
