<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SudPay - لوحة الإدارة العامة</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        <div class="bg-slate-900 text-white p-6 rounded-2xl">
            <h1 class="text-xl font-bold">لوحة الإدارة العامة والتحليلات (SudPay Admin)</h1>
            <p class="text-xs text-slate-400">مراقبة العمليات المالية وعمولات المنصة (2.5%)</p>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white p-5 rounded-xl border border-slate-200">
                <span class="text-slate-500 text-xs">إجمالي حجم المعاملات</span>
                <p class="text-2xl font-bold text-slate-900 mt-1">2,450,000 <span class="text-xs">ج.س</span></p>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200">
                <span class="text-slate-500 text-xs">عمولة المنصة الصافية</span>
                <p class="text-2xl font-bold text-green-600 mt-1">61,250 <span class="text-xs">ج.س</span></p>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200">
                <span class="text-slate-500 text-xs">العمليات النشطة</span>
                <p class="text-2xl font-bold text-blue-600 mt-1">18 عملية</p>
            </div>
        </div>
    </div>
</body>
</html>
