<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SudPay - المنصة الموحدة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col">
    <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-50 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <span class="bg-green-600 px-3 py-1 rounded-xl text-xl font-bold">SudPay</span>
                <span class="text-xs text-slate-400">النظام الموحد الشامل</span>
            </div>
            <nav class="flex bg-slate-800 p-1 rounded-xl text-sm">
                <button onclick="switchView('customer')" id="btn-customer" class="role-btn px-4 py-1.5 rounded-lg bg-green-600 text-white">العميل</button>
                <button onclick="switchView('vendor')" id="btn-vendor" class="role-btn px-4 py-1.5 rounded-lg text-slate-300">التاجر</button>
                <button onclick="switchView('carrier')" id="btn-carrier" class="role-btn px-4 py-1.5 rounded-lg text-slate-300">الشحن</button>
                <button onclick="switchView('admin')" id="btn-admin" class="role-btn px-4 py-1.5 rounded-lg text-slate-300">الإدارة</button>
            </nav>
        </div>
    </header>
    <main class="flex-1 max-w-7xl w-full mx-auto p-4">
        <section id="view-customer" class="view-section"><iframe src="/static/customer_app.html" class="w-full h-[750px] rounded-xl border bg-white"></iframe></section>
        <section id="view-vendor" class="view-section hidden"><iframe src="/static/vendor_dashboard.html" class="w-full h-[750px] rounded-xl border bg-white"></iframe></section>
        <section id="view-carrier" class="view-section hidden"><iframe src="/static/carrier_dashboard.html" class="w-full h-[750px] rounded-xl border bg-white"></iframe></section>
        <section id="view-admin" class="view-section hidden"><iframe src="/static/admin_dashboard.html" class="w-full h-[750px] rounded-xl border bg-white"></iframe></section>
    </main>
    <script>
        function switchView(role) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.role-btn').forEach(btn => { btn.classList.remove('bg-green-600', 'text-white'); btn.classList.add('text-slate-300'); });
            document.getElementById(`view-${role}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`btn-${role}`);
            activeBtn.classList.add('bg-green-600', 'text-white'); activeBtn.classList.remove('text-slate-300');
        }
    </script>
</body>
</html>
